<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
    <title>Калькулятор палива</title>
    <style>
        :root {
            --accent: var(--tg-theme-button-color, #2f80ed);
            --accent-text: var(--tg-theme-button-text-color, #ffffff);
            --link: var(--tg-theme-link-color, #2f80ed);
            --bg: var(--tg-theme-bg-color, #ffffff);
            --page: var(--tg-theme-secondary-bg-color, #eef1f6);
            --text: var(--tg-theme-text-color, #16181d);
            --hint: var(--tg-theme-hint-color, #9099a8);
            --border: color-mix(in srgb, var(--text) 10%, transparent);
            --field: color-mix(in srgb, var(--text) 4%, var(--bg));
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }

        html, body {
            background: var(--page);
            color: var(--text);
            font-family: -apple-system, "Segoe UI", Roboto, "Inter", sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            padding:
                calc(env(safe-area-inset-top, 0px) + var(--tg-safe-area-inset-top, 0px) + 20px)
                16px
                calc(env(safe-area-inset-bottom, 0px) + 28px);
            max-width: 480px;
            margin: 0 auto;
        }

        /* заголовок по центру як шапка додатка */
        .header {
            text-align: center;
            margin-bottom: 24px;
        }
        .header .icon {
            font-size: 34px;
            line-height: 1;
            margin-bottom: 8px;
        }
        .header h1 {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.3px;
        }
        .header p {
            color: var(--hint);
            font-size: 13px;
            margin-top: 4px;
        }

        .field {
            margin-bottom: 14px;
        }

        .field .lbl {
            display: block;
            color: var(--hint);
            font-weight: 600;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .6px;
            margin: 0 0 6px 4px;
        }
        .field .lbl .u {
            color: var(--link);
            font-weight: 700;
        }

        input {
            width: 100%;
            height: 58px;
            border: 1.5px solid var(--border);
            border-radius: 16px;
            background: var(--field);
            font-size: 24px;
            font-weight: 700;
            color: var(--text);
            padding: 0 18px;
            outline: none;
            transition: border-color .18s, background .18s;
            letter-spacing: -0.3px;
        }
        input::placeholder { color: var(--hint); font-weight: 500; }
        input:focus {
            border-color: var(--accent);
            background: var(--bg);
        }
        /* прибираємо стрілки-спіннери */
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }

        /* поле-результат */
        .result input {
            background: color-mix(in srgb, var(--accent) 8%, var(--bg));
            border-color: color-mix(in srgb, var(--accent) 20%, transparent);
            color: var(--link);
        }

        .divider { height: 20px; }

        /* підсумок — акцентна картка */
        .total {
            margin-top: 20px;
            background: var(--accent);
            border-radius: 20px;
            padding: 22px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            box-shadow: 0 8px 24px color-mix(in srgb, var(--accent) 35%, transparent);
        }
        .total .lbl {
            color: var(--accent-text);
            opacity: .85;
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: .8px;
        }
        .total .amount {
            color: var(--accent-text);
            font-size: 40px;
            font-weight: 800;
            letter-spacing: -1px;
            line-height: 1.1;
        }

        .hint {
            color: var(--hint);
            font-size: 12px;
            line-height: 1.5;
            text-align: center;
            margin-top: 18px;
            padding: 0 8px;
        }

        /* простір знизу, щоб останнє поле піднімалось над клавіатурою */
        .keyboard-spacer {
            height: 0;
            transition: height .2s ease;
        }

        /* панель навігації над клавіатурою (Далі / Готово) */
        .kb-nav {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            display: none;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            padding: 8px 12px calc(env(safe-area-inset-bottom, 0px) + 8px);
            background: var(--page);
            border-top: 1px solid var(--border);
            z-index: 100;
        }
        .kb-nav.show { display: flex; }
        .kb-nav .arrows { display: flex; gap: 8px; }
        .kb-nav button {
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            padding: 10px 18px;
            background: var(--field);
            color: var(--text);
            cursor: pointer;
        }
        .kb-nav button:disabled { opacity: .35; }
        .kb-nav .done {
            background: var(--accent);
            color: var(--accent-text);
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="icon">⛽</div>
        <h1>Вартість подорожі</h1>
        <p>Розрахунок витрат на паливо</p>
    </div>

    <div class="field">
        <span class="lbl">Відстань, <span class="u">км</span></span>
        <input type="number" id="distance" inputmode="decimal" placeholder="0">
    </div>

    <div class="field">
        <span class="lbl">Ср. витрата палива, <span class="u">л / 100 км</span></span>
        <input type="number" id="consumption" inputmode="decimal" placeholder="0">
    </div>

    <div class="field result">
        <span class="lbl">Необхідна кількість палива, <span class="u">л</span></span>
        <input type="text" id="liters" readonly placeholder="0">
    </div>

    <div class="divider"></div>

    <div class="field">
        <span class="lbl">Ціна палива, <span class="u">за літр</span></span>
        <input type="number" id="price" inputmode="decimal" placeholder="0">
    </div>

    <div class="total">
        <span class="lbl">Загальна вартість</span>
        <span class="amount" id="totalCost">0.00</span>
    </div>

    <p class="hint">
        Поточні місцеві ціни на паливо недоступні.
        Введіть ціну на паливо вручну.
    </p>

    <div class="keyboard-spacer" id="kbSpacer"></div>

    <div class="kb-nav" id="kbNav">
        <div class="arrows">
            <button type="button" id="navPrev">↑</button>
            <button type="button" id="navNext">↓</button>
        </div>
        <button type="button" class="done" id="navDone">Готово</button>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;

        if (tg) {
            tg.ready();
            tg.expand();
            try { tg.setHeaderColor('secondary_bg_color'); } catch (e) {}
            try { tg.setBackgroundColor('secondary_bg_color'); } catch (e) {}
            try { tg.disableVerticalSwipes(); } catch (e) {}

            const applySafeArea = () => {
                const sa = tg.safeAreaInset || {};
                document.documentElement.style.setProperty('--tg-safe-area-inset-top', (sa.top || 0) + 'px');
            };
            applySafeArea();
            tg.onEvent('safeAreaChanged', applySafeArea);
        }

        const haptic = () => { try { tg?.HapticFeedback?.selectionChanged(); } catch (e) {} };

        const $ = id => document.getElementById(id);
        const inputs = ['distance', 'consumption', 'price'];
        let lastCost = 0;

        function calculate(withHaptic = false) {
            const distKm = parseFloat($('distance').value) || 0;
            const consPer100 = parseFloat($('consumption').value) || 0;
            const price = parseFloat($('price').value) || 0;

            const liters = distKm * consPer100 / 100;
            const cost = liters * price;

            $('liters').value = liters > 0 ? liters.toFixed(2) : '';
            $('totalCost').textContent = cost.toFixed(2);

            if (withHaptic && Math.abs(cost - lastCost) > 0.001) haptic();
            lastCost = cost;
            updateMainButton(cost);
        }

        function updateMainButton(cost) {
            if (!tg?.MainButton) return;
            if (cost > 0) {
                tg.MainButton.setText('Поділитися: ' + cost.toFixed(2));
                tg.MainButton.show();
            } else {
                tg.MainButton.hide();
            }
        }

        if (tg?.MainButton) {
            tg.MainButton.onClick(() => {
                try { tg.HapticFeedback?.impactOccurred('medium'); } catch (e) {}
                const msg =
                    `⛽ Розрахунок палива\n` +
                    `Відстань: ${$('distance').value || 0} км\n` +
                    `Витрата: ${$('consumption').value || 0} л/100км\n` +
                    `Потрібно: ${$('liters').value || 0} л\n` +
                    `Вартість: ${$('totalCost').textContent}`;
                try { tg.sendData(msg); } catch (e) { tg.showAlert(msg); }
            });
        }

        inputs.forEach(id => $(id).addEventListener('input', () => calculate(true)));

        // --- керування клавіатурою на мобільному ---
        // редаговані поля по порядку (liters — readonly, пропускаємо)
        const editable = ['distance', 'consumption', 'price'];
        const kbNav = $('kbNav');
        const kbSpacer = $('kbSpacer');
        const navPrev = $('navPrev');
        const navNext = $('navNext');
        let currentIdx = -1;

        function scrollToActive(el) {
            // даємо клавіатурі з'явитись, потім піднімаємо поле у видиму зону
            setTimeout(() => {
                el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 250);
        }

        function updateNavState() {
            navPrev.disabled = currentIdx <= 0;
            navNext.disabled = currentIdx >= editable.length - 1;
        }

        function focusField(idx) {
            if (idx < 0 || idx >= editable.length) return;
            const el = $(editable[idx]);
            el.focus();
            // курсор у кінець
            const v = el.value;
            el.value = '';
            el.value = v;
        }

        editable.forEach((id, idx) => {
            const el = $(id);
            el.addEventListener('focus', () => {
                currentIdx = idx;
                kbNav.classList.add('show');
                kbSpacer.style.height = '320px'; // місце під клавіатуру
                updateNavState();
                scrollToActive(el);
            });
            el.addEventListener('blur', () => {
                // ховаємо панель лише якщо фокус пішов не на іншу нашу кнопку/поле
                setTimeout(() => {
                    const a = document.activeElement;
                    const stillEditing = editable.some(eid => $(eid) === a);
                    if (!stillEditing) {
                        kbNav.classList.remove('show');
                        kbSpacer.style.height = '0';
                    }
                }, 100);
            });
        });

        navPrev.addEventListener('click', (e) => {
            e.preventDefault();
            if (currentIdx > 0) focusField(currentIdx - 1);
        });
        navNext.addEventListener('click', (e) => {
            e.preventDefault();
            if (currentIdx < editable.length - 1) focusField(currentIdx + 1);
        });
        $('navDone').addEventListener('click', (e) => {
            e.preventDefault();
            $(editable[currentIdx])?.blur();
            kbNav.classList.remove('show');
            kbSpacer.style.height = '0';
        });

        calculate();
    </script>
</body>
</html>
