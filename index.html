<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
    <title>Калькулятор палива</title>
    <style>
        :root {
            --accent: var(--tg-theme-button-color, #2f80ed);
            --accent-text: var(--tg-theme-button-text-color, #ffffff);
            --link: var(--tg-theme-link-color, #2f80ed);
            --bg: var(--tg-theme-bg-color, #ffffff);
            --page: var(--tg-theme-secondary-bg-color, #eef1f6);
            --text: var(--tg-theme-text-color, #16181d);
            --hint: var(--tg-theme-hint-color, #9099a8);
            --border: color-mix(in srgb, var(--text) 10%, transparent);
            --field: color-mix(in srgb, var(--text) 4%, var(--bg));
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }

        html, body {
            background: var(--page);
            color: var(--text);
            font-family: -apple-system, "Segoe UI", Roboto, "Inter", sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            padding:
                calc(env(safe-area-inset-top, 0px) + var(--tg-safe-area-inset-top, 0px) + 12px)
                14px
                calc(env(safe-area-inset-bottom, 0px) + 16px);
            max-width: 480px;
            margin: 0 auto;
        }

        /* компактний заголовок */
        .header {
            text-align: center;
            margin-bottom: 10px;
        }
        .header h1 {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: -0.3px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
        }
        .header h1 .icon { font-size: 20px; line-height: 1; }
        .header p { color: var(--hint); font-size: 12px; margin-top: 2px; }

        .field { margin-bottom: 9px; }

        .field .lbl {
            display: block;
            color: var(--hint);
            font-weight: 600;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: .5px;
            margin: 0 0 4px 4px;
        }
        .field .lbl .u { color: var(--link); font-weight: 700; }

        input {
            width: 100%;
            height: 46px;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            background: var(--field);
            font-size: 19px;
            font-weight: 700;
            color: var(--text);
            padding: 0 14px;
            outline: none;
            transition: border-color .18s, background .18s;
            letter-spacing: -0.3px;
        }
        input::placeholder { color: var(--hint); font-weight: 500; }
        input:focus { border-color: var(--accent); background: var(--bg); }
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }

        .result input {
            background: color-mix(in srgb, var(--accent) 8%, var(--bg));
            border-color: color-mix(in srgb, var(--accent) 20%, transparent);
            color: var(--link);
        }

        .divider { height: 8px; }

        /* два результати поруч */
        .totals {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 12px;
        }
        .total {
            border-radius: 16px;
            padding: 14px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            text-align: center;
        }
        .total.one {
            background: var(--field);
            border: 1.5px solid var(--border);
        }
        .total.two {
            background: var(--accent);
            box-shadow: 0 6px 18px color-mix(in srgb, var(--accent) 30%, transparent);
        }
        .total .cap {
            font-weight: 600;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: .5px;
        }
        .total.one .cap { color: var(--hint); }
        .total.two .cap { color: var(--accent-text); opacity: .9; }

        .total .amount {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.8px;
            line-height: 1.05;
        }
        .total.one .amount { color: var(--text); }
        .total.two .amount { color: var(--accent-text); }

        .total .sub {
            font-size: 10px;
            font-weight: 500;
        }
        .total.one .sub { color: var(--hint); }
        .total.two .sub { color: var(--accent-text); opacity: .8; }

        .hint {
            color: var(--hint);
            font-size: 11px;
            line-height: 1.4;
            text-align: center;
            margin-top: 12px;
            padding: 0 8px;
        }

        .keyboard-spacer { height: 0; transition: height .2s ease; }

        .kb-nav {
            position: fixed; left: 0; right: 0; bottom: 0;
            display: none; justify-content: space-between; align-items: center; gap: 8px;
            padding: 8px 12px calc(env(safe-area-inset-bottom, 0px) + 8px);
            background: var(--page);
            border-top: 1px solid var(--border);
            z-index: 100;
        }
        .kb-nav.show { display: flex; }
        .kb-nav .arrows { display: flex; gap: 8px; }
        .kb-nav button {
            border: none; border-radius: 10px;
            font-size: 16px; font-weight: 600;
            padding: 10px 18px;
            background: var(--field); color: var(--text);
            cursor: pointer;
        }
        .kb-nav button:disabled { opacity: .35; }
        .kb-nav .done { background: var(--accent); color: var(--accent-text); }
    </style>
</head>
<body>
    <div class="header">
        <h1><span class="icon">⛽</span> Вартість подорожі</h1>
        <p>Розрахунок витрат на паливо</p>
    </div>

    <div class="field">
        <span class="lbl">Відстань, <span class="u">км</span></span>
        <input type="number" id="distance" inputmode="decimal" placeholder="0">
    </div>

    <div class="field">
        <span class="lbl">Ср. витрата палива, <span class="u">л / 100 км</span></span>
        <input type="number" id="consumption" inputmode="decimal" placeholder="0">
    </div>

    <div class="field">
        <span class="lbl">Ціна палива, <span class="u">за літр</span></span>
        <input type="number" id="price" inputmode="decimal" placeholder="0">
    </div>

    <div class="divider"></div>

    <div class="totals">
        <div class="total one">
            <span class="cap">В одну сторону</span>
            <span class="amount" id="costOne">0.00</span>
            <span class="sub" id="litersOne">0 л</span>
        </div>
        <div class="total two">
            <span class="cap">Туди-назад</span>
            <span class="amount" id="costTwo">0.00</span>
            <span class="sub" id="litersTwo">0 л</span>
        </div>
    </div>

    <div class="keyboard-spacer" id="kbSpacer"></div>

    <div class="kb-nav" id="kbNav">
        <div class="arrows">
            <button type="button" id="navPrev">↑</button>
            <button type="button" id="navNext">↓</button>
        </div>
        <button type="button" class="done" id="navDone">Готово</button>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;

        if (tg) {
            tg.ready();
            tg.expand();
            try { tg.setHeaderColor('secondary_bg_color'); } catch (e) {}
            try { tg.setBackgroundColor('secondary_bg_color'); } catch (e) {}
            try { tg.disableVerticalSwipes(); } catch (e) {}

            const applySafeArea = () => {
                const sa = tg.safeAreaInset || {};
                document.documentElement.style.setProperty('--tg-safe-area-inset-top', (sa.top || 0) + 'px');
            };
            applySafeArea();
            tg.onEvent('safeAreaChanged', applySafeArea);
        }

        const haptic = () => { try { tg?.HapticFeedback?.selectionChanged(); } catch (e) {} };

        const $ = id => document.getElementById(id);
        const inputs = ['distance', 'consumption', 'price'];
        let lastCost = 0;

        function calculate(withHaptic = false) {
            const distKm = parseFloat($('distance').value) || 0;
            const consPer100 = parseFloat($('consumption').value) || 0;
            const price = parseFloat($('price').value) || 0;

            // в одну сторону
            const litersOne = distKm * consPer100 / 100;
            const costOne = litersOne * price;
            // туди-назад (×2)
            const litersTwo = litersOne * 2;
            const costTwo = costOne * 2;

            $('costOne').textContent = costOne.toFixed(2);
            $('litersOne').textContent = litersOne.toFixed(1) + ' л';
            $('costTwo').textContent = costTwo.toFixed(2);
            $('litersTwo').textContent = litersTwo.toFixed(1) + ' л';

            if (withHaptic && Math.abs(costOne - lastCost) > 0.001) haptic();
            lastCost = costOne;
            updateMainButton(costOne, costTwo);
        }

        function updateMainButton(costOne, costTwo) {
            if (!tg?.MainButton) return;
            if (costOne > 0) {
                tg.MainButton.setText('Поділитися розрахунком');
                tg.MainButton.show();
            } else {
                tg.MainButton.hide();
            }
        }

        if (tg?.MainButton) {
            tg.MainButton.onClick(() => {
                try { tg.HapticFeedback?.impactOccurred('medium'); } catch (e) {}
                const msg =
                    `⛽ Розрахунок палива\n` +
                    `Відстань: ${$('distance').value || 0} км\n` +
                    `Витрата: ${$('consumption').value || 0} л/100км\n` +
                    `Ціна: ${$('price').value || 0}\n` +
                    `\nВ одну сторону: ${$('costOne').textContent} (${$('litersOne').textContent})\n` +
                    `Туди-назад: ${$('costTwo').textContent} (${$('litersTwo').textContent})`;
                try { tg.sendData(msg); } catch (e) { tg.showAlert(msg); }
            });
        }

        inputs.forEach(id => $(id).addEventListener('input', () => calculate(true)));

        // --- керування клавіатурою на мобільному ---
        const editable = ['distance', 'consumption', 'price'];
        const kbNav = $('kbNav');
        const kbSpacer = $('kbSpacer');
        const navPrev = $('navPrev');
        const navNext = $('navNext');
        let currentIdx = -1;

        function scrollToActive(el) {
            setTimeout(() => el.scrollIntoView({ behavior: 'smooth', block: 'center' }), 250);
        }
        function updateNavState() {
            navPrev.disabled = currentIdx <= 0;
            navNext.disabled = currentIdx >= editable.length - 1;
        }
        function focusField(idx) {
            if (idx < 0 || idx >= editable.length) return;
            const el = $(editable[idx]);
            el.focus();
            const v = el.value; el.value = ''; el.value = v;
        }

        editable.forEach((id, idx) => {
            const el = $(id);
            el.addEventListener('focus', () => {
                currentIdx = idx;
                kbNav.classList.add('show');
                kbSpacer.style.height = '300px';
                updateNavState();
                scrollToActive(el);
            });
            el.addEventListener('blur', () => {
                setTimeout(() => {
                    const a = document.activeElement;
                    const stillEditing = editable.some(eid => $(eid) === a);
                    if (!stillEditing) {
                        kbNav.classList.remove('show');
                        kbSpacer.style.height = '0';
                    }
                }, 100);
            });
        });

        navPrev.addEventListener('click', e => { e.preventDefault(); if (currentIdx > 0) focusField(currentIdx - 1); });
        navNext.addEventListener('click', e => { e.preventDefault(); if (currentIdx < editable.length - 1) focusField(currentIdx + 1); });
        $('navDone').addEventListener('click', e => {
            e.preventDefault();
            $(editable[currentIdx])?.blur();
            kbNav.classList.remove('show');
            kbSpacer.style.height = '0';
        });

        calculate();
    </script>
</body>
</html>
