<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
    <title>Калькулятор палива</title>
    <style>
        :root {
            --accent: var(--tg-theme-link-color, #2f80ed);
            --label: var(--tg-theme-link-color, #2f80ed);
            --bg: var(--tg-theme-bg-color, #ffffff);
            --card: var(--tg-theme-secondary-bg-color, #f4f5f7);
            --text: var(--tg-theme-text-color, #1a1a1a);
            --hint: var(--tg-theme-hint-color, #8a94a6);
            --field-bg: var(--tg-theme-bg-color, #ffffff);
            --border: color-mix(in srgb, var(--text) 15%, transparent);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html, body {
            margin: 0;
            background: var(--card);
            color: var(--text);
            font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        body {
            padding:
                calc(env(safe-area-inset-top, 0px) + var(--tg-safe-area-inset-top, 0px) + 16px)
                16px
                calc(env(safe-area-inset-bottom, 0px) + 24px);
        }

        .card {
            background: var(--bg);
            border-radius: 16px;
            padding: 20px 18px 8px;
            box-shadow: 0 1px 8px rgba(0,0,0,.04);
        }

        .tab {
            display: inline-block;
            background: var(--accent);
            color: #fff;
            font-weight: 600;
            font-size: 15px;
            padding: 11px 26px;
            border-radius: 22px;
            margin: 0 0 20px;
        }

        .field { margin-bottom: 18px; }

        .field label {
            display: block;
            color: var(--label);
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: .3px;
            margin-bottom: 8px;
        }

        /* поле = число + фіксована одиниця праворуч */
        .input-wrap {
            position: relative;
            display: flex;
            align-items: center;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--field-bg);
            height: 52px;
            padding: 0 14px;
            transition: border-color .15s;
        }

        .input-wrap:focus-within { border-color: var(--accent); }

        .input-wrap input {
            flex: 1;
            min-width: 0;
            border: none;
            outline: none;
            background: transparent;
            font-size: 20px;
            font-weight: 600;
            color: var(--text);
            text-align: right;
            padding: 0 10px 0 0;
        }

        .input-wrap input::placeholder {
            color: var(--hint);
            font-weight: 400;
        }

        .input-wrap .unit {
            flex-shrink: 0;
            color: var(--hint);
            font-size: 14px;
            font-weight: 500;
            white-space: nowrap;
        }

        .result-field .input-wrap {
            background: var(--card);
        }
        .result-field .input-wrap input { font-weight: 700; }

        .divider {
            height: 1px;
            background: var(--border);
            margin: 2px 0 18px;
        }

        .total {
            background: var(--card);
            border-radius: 14px;
            padding: 16px 18px;
            margin-top: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .total .lbl {
            color: var(--label);
            font-weight: 700;
            font-size: 13px;
            text-transform: uppercase;
        }

        .total .amount { font-size: 26px; font-weight: 800; }

        .hint {
            color: var(--hint);
            font-size: 12px;
            line-height: 1.5;
            margin: 14px 4px 0;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="tab">Вартість подорожі</div>

        <div class="field">
            <label>Відстань</label>
            <div class="input-wrap">
                <input type="number" id="distance" inputmode="decimal" placeholder="0">
                <span class="unit">км</span>
            </div>
        </div>

        <div class="field">
            <label>Ср. витрата палива</label>
            <div class="input-wrap">
                <input type="number" id="consumption" inputmode="decimal" placeholder="0">
                <span class="unit">л / 100 км</span>
            </div>
        </div>

        <div class="field result-field">
            <label>Необхідна кількість палива</label>
            <div class="input-wrap">
                <input type="text" id="liters" readonly placeholder="0">
                <span class="unit">л</span>
            </div>
        </div>

        <div class="divider"></div>

        <div class="field">
            <label>Вартість палива</label>
            <div class="input-wrap">
                <input type="number" id="price" inputmode="decimal" placeholder="0">
                <span class="unit">за літр</span>
            </div>
        </div>

        <div class="total">
            <span class="lbl">Загальна вартість</span>
            <span class="amount" id="totalCost">0.00</span>
        </div>
    </div>

    <p class="hint">
        Поточні місцеві ціни на паливо недоступні для цієї сторінки.
        Введіть ціну на паливо вручну.
    </p>

    <script>
        const tg = window.Telegram?.WebApp;

        if (tg) {
            tg.ready();
            tg.expand();
            try { tg.setHeaderColor('secondary_bg_color'); } catch (e) {}
            try { tg.setBackgroundColor('secondary_bg_color'); } catch (e) {}
            try { tg.disableVerticalSwipes(); } catch (e) {}

            const applySafeArea = () => {
                const sa = tg.safeAreaInset || {};
                document.documentElement.style.setProperty('--tg-safe-area-inset-top', (sa.top || 0) + 'px');
            };
            applySafeArea();
            tg.onEvent('safeAreaChanged', applySafeArea);
        }

        const haptic = () => {
            try { tg?.HapticFeedback?.selectionChanged(); } catch (e) {}
        };

        const $ = id => document.getElementById(id);
        const inputs = ['distance', 'consumption', 'price'];

        let lastCost = 0;

        function calculate(withHaptic = false) {
            const distKm = parseFloat($('distance').value) || 0;
            const consPer100 = parseFloat($('consumption').value) || 0;
            const price = parseFloat($('price').value) || 0;

            const liters = distKm * consPer100 / 100;
            const cost = liters * price;

            $('liters').value = liters > 0 ? liters.toFixed(2) : '';
            $('totalCost').textContent = cost.toFixed(2);

            if (withHaptic && Math.abs(cost - lastCost) > 0.001) haptic();
            lastCost = cost;

            updateMainButton(cost);
        }

        function updateMainButton(cost) {
            if (!tg?.MainButton) return;
            if (cost > 0) {
                tg.MainButton.setText('Поділитися: ' + cost.toFixed(2));
                tg.MainButton.show();
            } else {
                tg.MainButton.hide();
            }
        }

        if (tg?.MainButton) {
            tg.MainButton.onClick(() => {
                try { tg.HapticFeedback?.impactOccurred('medium'); } catch (e) {}
                const msg =
                    `⛽ Розрахунок палива\n` +
                    `Відстань: ${$('distance').value || 0} км\n` +
                    `Витрата: ${$('consumption').value || 0} л/100км\n` +
                    `Потрібно: ${$('liters').value || 0} л\n` +
                    `Вартість: ${$('totalCost').textContent}`;
                try { tg.sendData(msg); } catch (e) { tg.showAlert(msg); }
            });
        }

        inputs.forEach(id => {
            $(id).addEventListener('input', () => calculate(true));
        });

        calculate();
    </script>
</body>
</html>
